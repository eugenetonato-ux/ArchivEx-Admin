<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Outer ring accent -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8" />

  <!-- Centered Branding Graphic -->
  <g transform="translate(116, 116)" filter="url(#shadow)">
    <!-- Document Stack Base -->
    <path d="M40 70 L240 70 L240 230 L40 230 Z" fill="#FFFFFF" fill-opacity="0.1" rx="8" />
    <path d="M50 60 L250 60 L250 220 L50 220 Z" fill="#FFFFFF" fill-opacity="0.2" rx="8" />
    
    <!-- Main Top Document -->
    <rect x="60" y="50" width="200" height="160" rx="16" fill="#FFFFFF" />
    
    <!-- Document lines -->
    <rect x="90" y="135" width="140" height="12" rx="6" fill="#EDE9FE" />
    <rect x="90" y="157" width="100" height="12" rx="6" fill="#EDE9FE" />
    
    <!-- Graduation Cap Icon (ArchivEx style) inside document -->
    <path d="M160 80 L210 100 L160 120 L110 100 Z" fill="#5B3CC4" />
    <path d="M130 110 L130 130 C130 138, 190 138, 190 130 L190 110" fill="none" stroke="#5B3CC4" stroke-width="6" stroke-linecap="round" />
    <!-- Tassel -->
    <path d="M210 100 L220 115 L220 135" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round" />
    <circle cx="220" cy="138" r="4" fill="#EA580C" />
  </g>
</svg>
