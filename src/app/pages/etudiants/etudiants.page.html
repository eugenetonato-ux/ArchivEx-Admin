<ion-content class="ion-padding">
  <!-- Searchbar Filter Area -->
  <div class="page-filter-bar ion-margin-bottom">
    <ion-searchbar [(ngModel)]="filtre" placeholder="Rechercher par nom ou email... (Ctrl+K)"></ion-searchbar>
  </div>

  <app-loading-spinner
    *ngIf="loading"
    message="Chargement de l'annuaire des étudiants..."
    size="medium">
  </app-loading-spinner>

  <div *ngIf="!loading && etudiantsFiltres.length === 0" class="empty-state ion-text-center ion-padding">
    <i class="fa-solid fa-user-graduate" style="font-size: 2.5rem; color: #94a3b8; margin-bottom: 12px; display: block;"></i>
    <p style="font-size: 0.95rem; color: #64748b; margin: 0;">Aucun étudiant inscrit pour le moment (Nouveau projet).</p>
  </div>

  <ion-list *ngIf="!loading && etudiantsFiltres.length > 0">
    <ion-item *ngFor="let e of etudiantsFiltres">
      <i class="fa-solid fa-user" slot="start" style="font-size: 1.2rem; color: var(--ion-color-primary); margin-right: 12px;"></i>

      <ion-label>
        <h2>{{ e.full_name || 'Nom non renseigné' }}</h2>
        <p>{{ e.email }}</p>
      </ion-label>

      <div slot="end" class="toggles-group">
        <div class="toggle-item">
          <span class="toggle-label">Pass S1</span>
          <ion-toggle [checked]="e.premium_s1" (ionChange)="togglePass(e, 'premium_s1', $event.detail.checked)"></ion-toggle>
        </div>

        <div class="toggle-item">
          <span class="toggle-label">Pass S2</span>
          <ion-toggle [checked]="e.premium_s2" (ionChange)="togglePass(e, 'premium_s2', $event.detail.checked)"></ion-toggle>
        </div>
      </div>
    </ion-item>
  </ion-list>
</ion-content>
