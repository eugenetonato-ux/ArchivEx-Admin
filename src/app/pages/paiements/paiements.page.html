<ion-content class="ion-padding">
  <!-- Status Filter Segment -->
  <div class="page-filter-bar ion-margin-bottom">
    <ion-segment [value]="filtreStatut" (ionChange)="changerFiltre($event)">
      <ion-segment-button value="en_attente">
        <ion-label>En attente (0)</ion-label>
      </ion-segment-button>
      <ion-segment-button value="confirme">
        <ion-label>Confirmés (0)</ion-label>
      </ion-segment-button>
      <ion-segment-button value="rejete">
        <ion-label>Rejetés (0)</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <app-loading-spinner
    *ngIf="loading"
    message="Vérification et chargement de la file de transactions..."
    size="medium">
  </app-loading-spinner>

  <div *ngIf="!loading && paiements.length === 0" class="empty-state ion-text-center ion-padding">
    <i class="fa-solid fa-credit-card" style="font-size: 2.5rem; color: #94a3b8; margin-bottom: 12px; display: block;"></i>
    <p style="font-size: 0.95rem; color: #64748b; margin: 0;">Aucune transaction enregistrée pour le moment (Nouveau projet).</p>
  </div>

  <ion-list *ngIf="!loading && paiements.length > 0">
    <ion-item *ngFor="let p of paiements">
      <ion-label>
        <h2>{{ p.profile?.full_name || 'Étudiant' }} ({{ p.profile?.email }})</h2>
        <p>Montant: {{ p.montant | number }} FCFA | Semestre: {{ p.semestre }}</p>
        <p *ngIf="p.reference">Réf: {{ p.reference }}</p>
      </ion-label>

      <ion-badge slot="end" [color]="p.statut === 'confirme' ? 'success' : (p.statut === 'en_attente' ? 'warning' : 'danger')">
        {{ p.statut }}
      </ion-badge>

      <ion-button *ngIf="p.statut === 'en_attente'" slot="end" color="success" (click)="valider(p.id)">
        <i class="fa-solid fa-check" style="margin-right: 6px;"></i>
        Valider
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
