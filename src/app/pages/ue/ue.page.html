<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Gestion des Unités d'Enseignement (UE)</ion-title>
  </ion-toolbar>
  <ion-toolbar color="primary">
    <ion-segment [(ngModel)]="filtreSemestre">
      <ion-segment-button value="tous">
        <ion-label>Toutes ({{ ues.length }})</ion-label>
      </ion-segment-button>
      <ion-segment-button value="S1">
        <ion-label>Semestre 1 (S1)</ion-label>
      </ion-segment-button>
      <ion-segment-button value="S2">
        <ion-label>Semestre 2 (S2)</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="form-card">
    <ion-card-header>
      <ion-card-title>✨ Créer une Nouvelle UE</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item lines="full">
        <ion-label position="stacked">Intitulé de la Matière / UE</ion-label>
        <ion-input [(ngModel)]="nouvelleUe.nom" placeholder="ex: Algorithmique et Programmation C"></ion-input>
      </ion-item>
      <ion-item lines="full">
        <ion-label position="stacked">Code Unique UE</ion-label>
        <ion-input [(ngModel)]="nouvelleUe.code" placeholder="ex: INF101"></ion-input>
      </ion-item>
      <ion-item lines="none">
        <ion-label position="stacked">Semestre Rattaché</ion-label>
        <ion-select [(ngModel)]="nouvelleUe.semestre">
          <ion-select-option value="S1">Semestre 1 (S1)</ion-select-option>
          <ion-select-option value="S2">Semestre 2 (S2)</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-button expand="block" class="ion-margin-top" (click)="ajouter()">
        <ion-icon name="add-circle" slot="start"></ion-icon>
        Enregistrer l'UE
      </ion-button>
    </ion-card-content>
  </ion-card>

  <app-loading-spinner
    *ngIf="loading"
    message="Chargement des Unités d'Enseignement..."
    size="medium">
  </app-loading-spinner>

  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let ue of uesFiltrees">
      <ion-label>
        <h2>{{ ue.nom }}</h2>
        <p>Code: <strong>{{ ue.code }}</strong></p>
      </ion-label>
      <ion-badge slot="end" [color]="ue.semestre === 'S1' ? 'primary' : 'tertiary'">
        {{ ue.semestre }}
      </ion-badge>
      <ion-button slot="end" color="danger" fill="clear" (click)="supprimer(ue.id)">
        <ion-icon name="trash" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
