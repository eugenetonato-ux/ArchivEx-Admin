<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Unités d'Enseignement (UE)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Ajouter une UE</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">Nom de l'UE</ion-label>
        <ion-input [(ngModel)]="nouvelleUe.nom" placeholder="ex: Algorithmique et Programmation"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Code UE</ion-label>
        <ion-input [(ngModel)]="nouvelleUe.code" placeholder="ex: INF101"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Semestre</ion-label>
        <ion-select [(ngModel)]="nouvelleUe.semestre">
          <ion-select-option value="S1">Semestre 1 (S1)</ion-select-option>
          <ion-select-option value="S2">Semestre 2 (S2)</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-button expand="block" class="ion-margin-top" (click)="ajouter()">
        Créer l'UE
      </ion-button>
    </ion-card-content>
  </ion-card>

  <div *ngIf="loading" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>

  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let ue of ues">
      <ion-label>
        <h2>{{ ue.nom }} ({{ ue.code }})</h2>
        <p>{{ ue.semestre }}</p>
      </ion-label>
      <ion-button slot="end" color="danger" fill="clear" (click)="supprimer(ue.id)">
        <ion-icon name="trash" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
