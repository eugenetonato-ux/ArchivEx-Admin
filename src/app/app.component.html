<ion-app>
  <ion-split-pane contentId="main-content">
    
    <!-- On n'affiche le menu QUE si l'utilisateur est connecté -->
    @if (auth.currentUserId()) {
      <ion-menu contentId="main-content" type="overlay">
        <ion-content>
          <ion-list id="inbox-list">
            <ion-list-header>ArchivEx Admin</ion-list-header>
            <ion-note>Gestion de la plateforme</ion-note>
            
            @for (p of appPages; track p) {
              <ion-menu-toggle auto-hide="false">
                <ion-item [routerLink]="[p.url]" routerDirection="root" lines="none" [detail]="false">
                  <ion-icon slot="start" [ios]="p.icon" [md]="p.icon"></ion-icon>
                  <ion-label>{{ p.title }}</ion-label>
                </ion-item>
              </ion-menu-toggle>
            }
          </ion-list>
        </ion-content>
      </ion-menu>
    }

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
