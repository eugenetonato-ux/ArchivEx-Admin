<ion-app>
  <!-- Shell layout for admin dashboard routes -->
  <ng-container *ngIf="!isLoginPage; else authLayout">
    <app-shell-layout [pageTitle]="currentPageTitle">
      <ion-router-outlet></ion-router-outlet>
    </app-shell-layout>
  </ng-container>

  <!-- Login page layout without sidebar -->
  <ng-template #authLayout>
    <ion-router-outlet></ion-router-outlet>
  </ng-template>


</ion-app>
