<div class="charts-grid-container">
  <!-- Chart 1: Line Chart - Platform Consultations & Downloads -->
  <div class="chart-card main-chart-card">
    <div class="chart-header">
      <div class="chart-titles">
        <h3 class="chart-title">📊 Évolution de l'Activité & Consultations</h3>
        <p class="chart-subtitle">Volume de consultations de fiches et téléchargements PDF</p>
      </div>

      <!-- Time Range Selector Pills -->
      <div class="time-range-pills">
        <button
          class="range-pill"
          [class.active]="timeRange === '7d'"
          (click)="setTimeRange('7d')">
          7j
        </button>
        <button
          class="range-pill"
          [class.active]="timeRange === '30d'"
          (click)="setTimeRange('30d')">
          30j
        </button>
        <button
          class="range-pill"
          [class.active]="timeRange === 'acad'"
          (click)="setTimeRange('acad')">
          Année
        </button>
      </div>
    </div>

    <div class="chart-body line-chart-body">
      <canvas
        baseChart
        [data]="lineChartData"
        [options]="lineChartOptions"
        [type]="'line'">
      </canvas>
    </div>
  </div>

  <div class="charts-row-split">
    <!-- Chart 2: Doughnut Chart - Resource Type Breakdown -->
    <div class="chart-card doughnut-card">
      <div class="chart-header">
        <div class="chart-titles">
          <h3 class="chart-title">📑 Répartition des Documents</h3>
          <p class="chart-subtitle">Part épreuves vs corrigés & résumés premium</p>
        </div>
      </div>

      <div class="chart-body doughnut-chart-body">
        <canvas
          baseChart
          [data]="doughnutChartData"
          [options]="doughnutChartOptions"
          [type]="'doughnut'">
        </canvas>
      </div>
    </div>

    <!-- Chart 3: Bar Chart - Revenues per Payment Gateway -->
    <div class="chart-card bar-card">
      <div class="chart-header">
        <div class="chart-titles">
          <h3 class="chart-title">💳 Recettes par Canal de Paiement</h3>
          <p class="chart-subtitle">MoMo, Moov Money, Celtiis et Wave</p>
        </div>
      </div>

      <div class="chart-body bar-chart-body">
        <canvas
          baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="'bar'">
        </canvas>
      </div>
    </div>
  </div>
</div>
