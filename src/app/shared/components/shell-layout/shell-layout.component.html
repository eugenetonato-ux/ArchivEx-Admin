<div class="shell-container" [class.mobile-open]="mobileMenuOpen()">
  <!-- Backdrop Overlay for Mobile Screen -->
  <div class="mobile-backdrop" (click)="closeMobileMenu()"></div>

  <!-- Integrated Standalone Responsive Sidebar Component -->
  <app-sidebar-nav
    class="sidebar-host"
    [currentUserEmail]="authSvc.currentUser()?.email || 'admin@archivex.univ.bj'"
    [pendingPaiementsCount]="pendingPaiementsCount()"
    (linkClick)="closeMobileMenu()"
    (logout)="logout()">
  </app-sidebar-nav>

  <!-- Main Content Layout Area -->
  <div class="admin-main-wrapper">
    <!-- Remodeled High-End Top Bar / Navbar with Uniform Primary Background -->
    <header class="admin-topbar">
      <div class="topbar-left">
        <!-- Single Mobile Hamburger Toggle Button -->
        <button
          class="mobile-hamburger-btn mobile-only"
          (click)="toggleMobileMenu()"
          title="Ouvrir le menu">
          <i class="fa-solid fa-bars"></i>
        </button>

        <div class="brand-badge-pill">
          <span class="app-tag">ARCHIVEX SYSTEM</span>
        </div>

        <h1 class="page-title">{{ pageTitle }}</h1>
      </div>

      <!-- Centered Search Bar -->
      <div class="topbar-center">
        <app-global-search></app-global-search>
      </div>

      <div class="topbar-right">
        <!-- Fullscreen Mode Switcher -->
        <button
          class="topbar-action-pill fullscreen-btn"
          (click)="toggleFullscreen()"
          [title]="isFullscreen() ? 'Quitter le mode plein écran' : 'Passer en mode plein écran'">
          <div class="pill-icon-wrap">
            <i [class]="isFullscreen() ? 'fa-solid fa-compress' : 'fa-solid fa-expand'"></i>
          </div>
          <span class="pill-label desktop-only">{{ isFullscreen() ? 'Réduire' : 'Plein écran' }}</span>
        </button>

        <!-- Dark / Light Mode Quick Switcher with Persistence -->
        <button
          class="topbar-action-pill theme-toggle-pill"
          (click)="themeSvc.toggleDarkMode()"
          [title]="themeSvc.darkMode() ? 'Passer en mode clair' : 'Passer en mode sombre'"
          [class.is-dark]="themeSvc.darkMode()">
          <div class="pill-icon-wrap">
            <i [class]="themeSvc.darkMode() ? 'fa-solid fa-sun' : 'fa-solid fa-moon'"></i>
          </div>
          <span class="pill-label desktop-only">{{ themeSvc.darkMode() ? 'Clair' : 'Sombre' }}</span>
        </button>

        <!-- User Quick Status Badge -->
        <div class="header-user-pill">
          <div class="user-avatar-small">AD</div>
          <div class="status-indicator">
            <span class="user-dot"></span>
            <span class="status-text desktop-only">En ligne</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Viewport Slot -->
    <main class="admin-content-area">
      <ng-content></ng-content>
    </main>
  </div>

  <!-- Floating Help Button for Keyboard Shortcuts (?) -->
  <button
    class="floating-shortcuts-btn"
    (click)="shortcutsSvc.toggleHelpModal()"
    title="Raccourcis clavier (?) ou H">
    <i class="fa-solid fa-question btn-symbol"></i>
    <span class="btn-tooltip">Raccourcis Clavier (?)</span>
  </button>

  <!-- Interactive Keyboard Shortcuts Modal -->
  <app-shortcuts-modal></app-shortcuts-modal>
</div>
