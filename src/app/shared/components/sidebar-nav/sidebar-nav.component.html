<aside
  class="admin-sidebar-inner"
  [class.is-collapsed]="collapsed && !hoverExpanded()"
  [class.is-hover-expanded]="collapsed && hoverExpanded()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()">

  <!-- Sidebar Header with Brand & 3-Dots Hamburger Menu Trigger -->
  <div class="sidebar-header">
    <div class="brand-logo" routerLink="/dashboard" (click)="onNavItemClick()">
      <div class="logo-icon">
        <ion-icon name="folder-open"></ion-icon>
      </div>
      <div class="brand-text">
        <span class="brand-title">ArchivEx</span>
        <span class="brand-subtitle">PORTAIL ADMIN</span>
      </div>
    </div>

    <!-- Stylish 3-Dots Hamburger Menu Toggle Button -->
    <button
      class="three-dots-toggle-btn desktop-only"
      (click)="onCollapseToggle()"
      (mouseenter)="onMouseEnter()"
      [title]="collapsed ? 'Déplier le menu (Survoler ou Cliquer)' : 'Réduire le menu'">
      <div class="dots-wrapper">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </button>

    <button
      class="close-mobile-btn mobile-only"
      (click)="onNavItemClick()"
      title="Fermer le menu">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <!-- Sidebar Navigation Menu with Categorized Groups -->
  <nav class="sidebar-nav">
    <div *ngFor="let group of navGroups" class="nav-group">
      <div class="group-label">
        {{ group.groupName }}
      </div>

      <ul class="nav-list">
        <li *ngFor="let item of group.items" class="nav-item">
          <a
            [routerLink]="item.url"
            routerLinkActive="active"
            (click)="onNavItemClick()"
            class="nav-link"
            [title]="collapsed && !hoverExpanded() ? item.title : ''">

            <div class="icon-glow-wrap">
              <ion-icon [name]="item.icon" class="nav-icon"></ion-icon>
            </div>

            <span class="nav-text">{{ item.title }}</span>

            <ion-badge
              *ngIf="item.badge"
              [color]="item.badgeColor || 'primary'"
              class="nav-badge">
              {{ item.badge }}
            </ion-badge>

            <!-- Tooltip preview when collapsed -->
            <div class="collapsed-tooltip">
              {{ item.title }}
            </div>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar Footer / User Profile & Logout Button -->
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="avatar">
        <span>AD</span>
      </div>
      <div class="user-details">
        <span class="user-name">Administrateur</span>
        <span class="user-email" [title]="currentUserEmail">{{ currentUserEmail }}</span>
      </div>
    </div>

    <button
      class="logout-btn"
      (click)="onLogoutClick()"
      [title]="'Se déconnecter (' + currentUserEmail + ')'">
      <ion-icon name="log-out-outline"></ion-icon>
      <span class="logout-text">Déconnexion</span>
    </button>
  </div>
</aside>
