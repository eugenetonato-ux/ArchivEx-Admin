<aside class="admin-sidebar-inner">
  <!-- Sidebar Header with Brand -->
  <div class="sidebar-header">
    <div class="brand-logo" routerLink="/dashboard" (click)="onNavItemClick()">
      <div class="logo-icon">
        <ion-icon name="folder-open"></ion-icon>
      </div>
      <div class="brand-text">
        <span class="brand-title">ArchivEx</span>
        <span class="brand-subtitle">PORTAIL ADMIN</span>
      </div>
    </div>
  </div>

  <!-- Sidebar Navigation Menu with Categorized Groups -->
  <nav class="sidebar-nav">
    <div *ngFor="let group of navGroups" class="nav-group">
      <div class="group-label">
        {{ group.groupName }}
      </div>

      <ul class="nav-list">
        <li *ngFor="let item of group.items" class="nav-item">
          <a
            [routerLink]="item.url"
            routerLinkActive="active"
            (click)="onNavItemClick()"
            class="nav-link">

            <div class="icon-glow-wrap">
              <ion-icon [name]="item.icon" class="nav-icon"></ion-icon>
            </div>

            <span class="nav-text">{{ item.title }}</span>

            <ion-badge
              *ngIf="item.badge"
              [color]="item.badgeColor || 'primary'"
              class="nav-badge">
              {{ item.badge }}
            </ion-badge>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar Footer / User Profile & Logout Button -->
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="avatar">
        <span>AD</span>
      </div>
      <div class="user-details">
        <span class="user-name">Administrateur</span>
        <span class="user-email" [title]="currentUserEmail">{{ currentUserEmail }}</span>
      </div>
    </div>

    <button
      class="logout-btn"
      (click)="onLogoutClick()"
      [title]="'Se déconnecter (' + currentUserEmail + ')'">
      <ion-icon name="log-out-outline"></ion-icon>
      <span class="logout-text">Déconnexion</span>
    </button>
  </div>
</aside>
